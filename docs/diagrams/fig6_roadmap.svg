<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5D8E"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="15" font-weight="bold" fill="#374151">One model — YOLO26n — travels the whole road. The phases change its form, never its identity.</text>

  <!-- axis -->
  <line x1="70" y1="120" x2="1120" y2="120" stroke="#2F5D8E" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- nodes -->
  <g>
    <circle cx="120" cy="120" r="13" fill="#E7EEF8" stroke="#2F5D8E" stroke-width="2.5"/>
    <text x="120" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">0</text>
    <rect x="52" y="150" width="136" height="150" rx="5" fill="#F4F8FD" stroke="#2F5D8E" stroke-width="1.4"/>
    <text x="120" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">Environment</text>
    <text x="64" y="198" font-size="11.5" fill="#4B5563">Python 3.11 next</text>
    <text x="64" y="214" font-size="11.5" fill="#4B5563">to the old 3.7</text>
    <text x="64" y="234" font-size="11.5" fill="#4B5563">venv, git init</text>
    <text x="64" y="254" font-size="11.5" fill="#4B5563">ultralytics, cv2</text>
    <text x="64" y="282" font-size="11.5" fill="#9CA3AF">~20 min</text>
  </g>

  <g>
    <circle cx="263" cy="120" r="13" fill="#FCF1E4" stroke="#B9762F" stroke-width="2.5"/>
    <text x="263" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#8A5620">0.5</text>
    <rect x="195" y="150" width="136" height="150" rx="5" fill="#FCF7F2" stroke="#B9762F" stroke-width="1.4"/>
    <text x="263" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#8A5620">Weights</text>
    <text x="207" y="198" font-size="11.5" fill="#4B5563">fetch_models.py</text>
    <text x="207" y="218" font-size="11.5" fill="#4B5563">yolo26n + s</text>
    <text x="207" y="238" font-size="11.5" fill="#4B5563">SHA256 recorded</text>
    <text x="207" y="266" font-size="11.5" font-weight="bold" fill="#B9762F">last network use</text>
    <text x="207" y="282" font-size="11.5" font-weight="bold" fill="#B9762F">until phase 4</text>
  </g>

  <g>
    <circle cx="406" cy="120" r="15" fill="#2F5D8E" stroke="#1B3B5C" stroke-width="2.5"/>
    <text x="406" y="96" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">1</text>
    <rect x="338" y="150" width="136" height="150" rx="5" fill="#E7EEF8" stroke="#2F5D8E" stroke-width="2"/>
    <text x="406" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">Still images</text>
    <text x="350" y="198" font-size="11.5" fill="#4B5563">core/ library</text>
    <text x="350" y="218" font-size="11.5" fill="#4B5563">boxes, crosshair</text>
    <text x="350" y="238" font-size="11.5" fill="#4B5563">dx / dy, JSON</text>
    <text x="350" y="258" font-size="11.5" fill="#4B5563">colour, callback</text>
    <text x="350" y="282" font-size="11.5" fill="#9CA3AF">~700 lines</text>
    <text x="406" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#B91C1C">YOU ARE HERE</text>
  </g>

  <g>
    <circle cx="549" cy="120" r="13" fill="#FFFFFF" stroke="#2F5D8E" stroke-width="2.5"/>
    <text x="549" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">2</text>
    <rect x="481" y="150" width="136" height="150" rx="5" fill="#FBFCFD" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="549" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#374151">Video</text>
    <text x="493" y="198" font-size="11.5" fill="#4B5563">webcam, files</text>
    <text x="493" y="218" font-size="11.5" fill="#4B5563">ByteTrack IDs</text>
    <text x="493" y="238" font-size="11.5" fill="#4B5563">target lock</text>
    <text x="493" y="258" font-size="11.5" fill="#4B5563">rules + debounce</text>
    <text x="493" y="282" font-size="11.5" fill="#4B5563">OpenVINO export</text>
  </g>

  <g>
    <circle cx="692" cy="120" r="13" fill="#FFFFFF" stroke="#2F5D8E" stroke-width="2.5"/>
    <text x="692" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">3</text>
    <rect x="624" y="150" width="136" height="150" rx="5" fill="#FBFCFD" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="692" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#374151">Desktop app</text>
    <text x="636" y="198" font-size="11.5" fill="#4B5563">PySide6 / Qt</text>
    <text x="636" y="218" font-size="11.5" fill="#4B5563">settings, sliders</text>
    <text x="636" y="238" font-size="11.5" fill="#4B5563">object list</text>
    <text x="636" y="266" font-size="11.5" fill="#9CA3AF">ui/ imports core/</text>
    <text x="636" y="282" font-size="11.5" fill="#9CA3AF">never the reverse</text>
  </g>

  <g>
    <circle cx="835" cy="120" r="13" fill="#FFFFFF" stroke="#B9762F" stroke-width="2.5"/>
    <text x="835" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#8A5620">4</text>
    <rect x="767" y="150" width="136" height="150" rx="5" fill="#FCF7F2" stroke="#B9762F" stroke-width="1.4"/>
    <text x="835" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#8A5620">Custom classes</text>
    <text x="779" y="198" font-size="11.5" fill="#4B5563">shoot own video</text>
    <text x="779" y="218" font-size="11.5" fill="#4B5563">Label Studio</text>
    <text x="779" y="238" font-size="11.5" fill="#4B5563">Kaggle fine-tune</text>
    <text x="779" y="258" font-size="11.5" fill="#4B5563">pen, flowers</text>
    <text x="779" y="282" font-size="11.5" fill="#B9762F">network used again</text>
  </g>

  <g>
    <circle cx="1000" cy="120" r="13" fill="#FFFFFF" stroke="#2F5D8E" stroke-width="2.5"/>
    <text x="1000" y="98" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#1B3B5C">5</text>
    <rect x="932" y="150" width="136" height="150" rx="5" fill="#FBFCFD" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="1000" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#374151">Raspberry Pi</text>
    <text x="944" y="198" font-size="11.5" fill="#4B5563">NCNN or Hailo</text>
    <text x="944" y="218" font-size="11.5" fill="#4B5563">FastAPI web UI</text>
    <text x="944" y="246" font-size="11.5" fill="#9CA3AF">then optionally:</text>
    <text x="944" y="264" font-size="11.5" fill="#9CA3AF">printed-text OCR</text>
    <text x="944" y="282" font-size="11.5" fill="#9CA3AF">local VLM button</text>
  </g>

  <!-- additive note -->
  <rect x="52" y="360" width="1016" height="104" rx="6" fill="#F4F8FD" stroke="#2F5D8E" stroke-width="1.5"/>
  <text x="70" y="386" font-size="13.5" font-weight="bold" fill="#1B3B5C">Each phase ADDS files. None rewrites the previous one.</text>
  <text x="70" y="412" font-size="12.5" fill="#4B5563">Phase 2 adds tracker.py and rules.py, plus a video branch in source.py.</text>
  <text x="70" y="432" font-size="12.5" fill="#4B5563">Phase 3 adds ui/ and imports core/ unchanged.</text>
  <text x="70" y="452" font-size="12.5" fill="#4B5563">Phase 4 changes one config line. Phase 5 changes one line in detector.py.</text>

  <text x="60" y="516" font-size="13" fill="#6B7280">Not on the road, deliberately: face recognition, instance segmentation, handwriting OCR, a C++ rewrite, servo hardware.</text>
  <text x="60" y="540" font-size="13" fill="#6B7280">core/aim.py exists as a stub so that adding real pan-tilt servos later costs one file and no edits anywhere else.</text>
</svg>
