<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="740" fill="#FFFFFF"/>

  <text x="80" y="38" font-size="16" font-weight="bold" fill="#1F2937">What the phase 1 window shows</text>
  <text x="80" y="58" font-size="13" fill="#6B7280">Mock-up of the overlay. Values are illustrative.</text>

  <!-- camera frame -->
  <rect x="80" y="72" width="880" height="495" fill="#EDEFF2" stroke="#374151" stroke-width="2"/>
  <text x="92" y="92" font-size="12" fill="#9CA3AF">frame 1280 x 720</text>

  <!-- object 1: person -->
  <rect x="170" y="142" width="190" height="320" fill="none" stroke="#1FA34A" stroke-width="3"/>
  <rect x="170" y="116" width="128" height="26" fill="#1FA34A"/>
  <text x="178" y="135" font-size="14" font-weight="bold" fill="#FFFFFF">person  0.91</text>
  <g stroke="#1FA34A" stroke-width="2.6">
    <line x1="255" y1="302" x2="275" y2="302"/>
    <line x1="265" y1="292" x2="265" y2="312"/>
  </g>
  <rect x="178" y="414" width="174" height="40" fill="#FFFFFF" stroke="#1FA34A" stroke-width="1.2"/>
  <text x="186" y="431" font-size="13" fill="#1F2937">dx -255  dy -18 px</text>
  <text x="186" y="448" font-size="12" fill="#4B5563">-58 %  /  -7 % of half-frame</text>

  <!-- object 2: bottle -->
  <rect x="620" y="120" width="70" height="140" fill="none" stroke="#1FA34A" stroke-width="3"/>
  <rect x="620" y="94" width="112" height="26" fill="#1FA34A"/>
  <text x="628" y="113" font-size="14" font-weight="bold" fill="#FFFFFF">bottle  0.63</text>
  <g stroke="#1FA34A" stroke-width="2.6">
    <line x1="645" y1="190" x2="665" y2="190"/>
    <line x1="655" y1="180" x2="655" y2="200"/>
  </g>
  <rect x="626" y="268" width="176" height="40" fill="#FFFFFF" stroke="#1FA34A" stroke-width="1.2"/>
  <text x="634" y="285" font-size="13" fill="#1F2937">dx +135  dy -130 px</text>
  <text x="634" y="302" font-size="12" fill="#4B5563">+31 %  /  -53 %</text>

  <!-- object 3: cell phone -->
  <rect x="650" y="352" width="130" height="95" fill="none" stroke="#1FA34A" stroke-width="3"/>
  <rect x="650" y="326" width="142" height="26" fill="#1FA34A"/>
  <text x="658" y="345" font-size="14" font-weight="bold" fill="#FFFFFF">cell phone  0.78</text>
  <g stroke="#1FA34A" stroke-width="2.6">
    <line x1="705" y1="399.5" x2="725" y2="399.5"/>
    <line x1="715" y1="389.5" x2="715" y2="409.5"/>
  </g>
  <rect x="656" y="458" width="168" height="40" fill="#FFFFFF" stroke="#1FA34A" stroke-width="1.2"/>
  <text x="664" y="475" font-size="13" fill="#1F2937">dx +195  dy +80 px</text>
  <text x="664" y="492" font-size="12" fill="#4B5563">+44 %  /  +32 %</text>

  <!-- suppressed detection -->
  <rect x="838" y="180" width="96" height="70" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="838" y="172" font-size="12.5" fill="#6B7280">book  0.31  — below threshold,</text>
  <text x="838" y="266" font-size="12.5" fill="#6B7280">not drawn, written to JSON only</text>

  <!-- frame centre crosshair, drawn last so nothing covers it -->
  <text x="520" y="290" font-size="12.5" text-anchor="middle" fill="#B91C1C">frame centre (640, 360)</text>
  <g stroke="#B91C1C" stroke-width="2.4">
    <line x1="496" y1="319.5" x2="544" y2="319.5"/>
    <line x1="520" y1="295.5" x2="520" y2="343.5"/>
  </g>
  <circle cx="520" cy="319.5" r="5" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>

  <!-- console panel -->
  <rect x="80" y="588" width="540" height="130" rx="4" fill="#1F2937"/>
  <text x="96" y="612" font-size="12.5" fill="#9CA3AF" font-family="Consolas, monospace">$ python detect.py --source data/test_images/desk.jpg</text>
  <text x="96" y="634" font-size="12.5" fill="#E5E7EB" font-family="Consolas, monospace">person      0.91   dx=-255  dy=-18</text>
  <text x="96" y="654" font-size="12.5" fill="#E5E7EB" font-family="Consolas, monospace">bottle      0.63   dx=+135  dy=-130</text>
  <text x="96" y="674" font-size="12.5" fill="#E5E7EB" font-family="Consolas, monospace">cell phone  0.78   dx=+195  dy=+80</text>
  <text x="96" y="700" font-size="12.5" fill="#6EE7A8" font-family="Consolas, monospace">3 detections  |  118 ms  |  out/desk.json</text>

  <!-- legend -->
  <rect x="650" y="588" width="470" height="130" rx="5" fill="#FBFCFD" stroke="#D1D5DB" stroke-width="1.4"/>
  <text x="668" y="612" font-size="13.5" font-weight="bold" fill="#374151">Overlay elements</text>

  <g stroke="#B91C1C" stroke-width="2.2">
    <line x1="670" y1="634" x2="686" y2="634"/>
    <line x1="678" y1="626" x2="678" y2="642"/>
  </g>
  <text x="698" y="639" font-size="12.5" fill="#4B5563">crosshair — the centre of the frame</text>

  <rect x="670" y="654" width="16" height="12" fill="none" stroke="#1FA34A" stroke-width="2.4"/>
  <text x="698" y="665" font-size="12.5" fill="#4B5563">box and label — class and confidence</text>

  <g stroke="#1FA34A" stroke-width="2.6">
    <line x1="670" y1="686" x2="686" y2="686"/>
    <line x1="678" y1="678" x2="678" y2="694"/>
  </g>
  <text x="698" y="691" font-size="12.5" fill="#4B5563">small green cross — the centre of the object</text>

  <text x="670" y="713" font-size="12.5" font-weight="bold" fill="#1F2937">dx / dy</text>
  <text x="726" y="713" font-size="12.5" fill="#4B5563">— offset from the frame centre, in px and %</text>
</svg>
